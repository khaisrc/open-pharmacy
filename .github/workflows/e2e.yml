name: e2e

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on branches, but not on main: every commit to main
# gets its own run, so we don't miss a regression.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Listing any scope here zeroes every other one, contents included --
    # checkout needs contents: read to clone at all, so it has to be named
    # even though this job never writes to the repo itself.
    permissions:
      contents: read
      # Not issues: write, even though the comment goes through an
      # /issues/{n}/comments URL. That endpoint is gated by whichever of the
      # two the number resolves to, and a PR resolves to pull-requests --
      # which is just as well, since this repo has Issues turned off and so
      # can grant issues: write to nothing.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # `up -d web` starts db, waits on its healthcheck, runs the one-shot
      # migrate service and then serves -- the same three services a developer
      # gets from `docker compose up`, so CI exercises the stack that ships.
      - name: Start the stack
        run: docker compose up -d --build web

      # Compose returns once the container is running, which is a moment before
      # runserver is listening. run.sh's own preflight has no retry -- it is
      # written for a developer who can just start the server -- so the waiting
      # happens here.
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "The API never came up" >&2
          docker compose logs web >&2
          exit 1

      # From the runner rather than from a container: the suite is bash, curl
      # and jq, all of which ubuntu-latest already has, and crossing the network
      # boundary the way a client does is the whole point of it. Talking to the
      # published port is also what a developer does locally.
      - name: Run the e2e suite
        run: ./e2e/run.sh

      # The HTML report is self-contained and readable in a browser, so attach
      # it whether or not the run passed -- a failure is exactly when someone
      # wants the request and response behind it.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/report.html
            e2e/junit.xml
          if-no-files-found: warn

      - name: Server logs
        if: failure()
        run: docker compose logs web

      # Runs even if the suite failed (or never got the chance to), so the
      # comment always reflects this run rather than going stale on a
      # failure. Only on a PR: a push to main has no PR to comment on.
      - name: Post summary comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/junit_summary.py e2e/junit.xml e2e |
            .github/scripts/pr_comment.sh e2e

      - name: Stop the stack
        if: always()
        run: docker compose down -v
