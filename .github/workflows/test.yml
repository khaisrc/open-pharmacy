name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on branches, but not on main: every commit to main
# gets its own run, so we don't miss a regression.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every `run` below goes through bash with pipefail. Naming the shell is what
# turns it on: the default is plain `bash -e`, where a pipeline reports only
# its last command, so `ruff format --check ... | tee` reported tee's success
# and a failing check went green.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    # Listing any scope here zeroes every other one, contents included --
    # checkout needs contents: read to clone at all, so it has to be named
    # even though this job never writes to the repo itself.
    permissions:
      contents: read
      # Not issues: write, even though the comment goes through an
      # /issues/{n}/comments URL. That endpoint is gated by whichever of the
      # two the number resolves to, and a PR resolves to pull-requests --
      # which is just as well, since this repo has Issues turned off and so
      # can grant issues: write to nothing.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Compose is what a developer runs, so CI runs the same thing: one
      # definition of the environment, and the image that ships is the image
      # the tests ran in. `run` starts the db service, waits on its healthcheck
      # and runs the one-shot migrate service; pytest still builds and tears
      # down its own test database.
      - name: Build the image
        run: docker compose build web

      # --junitxml writes into the bind-mounted /app, which the runner owns as
      # a different uid than the image's app user -- the same mismatch the
      # lint job works around for ruff's cache, and pytest cannot create a
      # file there. Creating it here first is enough: writing a file that
      # already exists needs write on the file, not the right to add one to
      # the directory. The report is what the summary comment step reads.
      - name: Run the test suite
        run: |
          touch pytest-junit.xml && chmod 666 pytest-junit.xml
          docker compose run --rm -T web python -m pytest -q --junitxml=pytest-junit.xml

      # Runs even if pytest failed, so the comment always reflects this run
      # rather than going stale on a failure. Only on a PR: a push to main
      # has no PR to comment on.
      - name: Post summary comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/junit_summary.py pytest-junit.xml test |
            .github/scripts/pr_comment.sh test

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build web

      # The three checks below each keep going on failure and tee their
      # output, so the summary comment can report all three rather than only
      # the first one to break. continue-on-error also means none of them
      # fails the job, which is what the gate step at the end is for.
      #
      # --no-cache because /app is the bind-mounted checkout, which the
      # runner owns as a different uid than the image's app user, so ruff
      # cannot create .ruff_cache there. CI reuses no cache between runs anyway.
      - name: ruff check
        id: ruff_check
        continue-on-error: true
        run: docker compose run --rm -T web ruff check --no-cache . 2>&1 | tee lint-ruff-check.txt

      - name: ruff format
        id: ruff_format
        continue-on-error: true
        run: docker compose run --rm -T web ruff format --check --no-cache . 2>&1 | tee lint-ruff-format.txt

      # A model edited without its migration passes every test and then fails
      # on deploy, so the check belongs in CI rather than in review.
      - name: Every model change has a migration
        id: migrations
        continue-on-error: true
        run: docker compose run --rm -T web python manage.py makemigrations --check --dry-run 2>&1 | tee lint-migrations.txt

      - name: Post summary comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          .github/scripts/lint_summary.sh \
            "ruff check"  "${{ steps.ruff_check.outcome }}"  lint-ruff-check.txt \
            "ruff format" "${{ steps.ruff_format.outcome }}" lint-ruff-format.txt \
            "migrations"  "${{ steps.migrations.outcome }}"  lint-migrations.txt |
            .github/scripts/pr_comment.sh lint

      # continue-on-error above means a failed check leaves the job green, so
      # this is what actually fails it. Without it the whole job would pass
      # while the comment reported the failure.
      - name: Fail if any check failed
        if: >-
          steps.ruff_check.outcome == 'failure' ||
          steps.ruff_format.outcome == 'failure' ||
          steps.migrations.outcome == 'failure'
        run: exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down -v
