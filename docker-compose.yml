services:
  db:
    image: postgres:18
    # The same file web reads, so the credentials the server dials are the
    # credentials the database was created with. (Compose's own ${...}
    # interpolation never reads env_file, only the shell and a `.env`.)
    env_file: .env.local
    ports:
      # Interpolated by Compose from the shell, not from .env.local:
      #   DB_PORT=5433 docker compose up
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates the second database the identity server keeps its tables in.
      - ./scripts/create-auth-db.sh:/docker-entrypoint-initdb.d/create-auth-db.sh:ro
    healthcheck:
      # $$ defers expansion to the container's shell, where env_file applies.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: runs the migrations and the local seed once per `up`, and web
  # waits for it to finish. Keeping this out of the server's own start-up means
  # a deployment with several replicas never has them racing to apply the same
  # DDL; uat and prod run the same `migrate` as a pre-deploy job.
  migrate:
    build: .
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_local"]

  # The identity server (Logto). Seeds its own database on first start and
  # serves the console on 3002; the API verifies tokens against 3001.
  # Configure it as docs/deployment.md describes (resource, scopes, roles,
  # customizer).
  #
  # Behind the `auth` profile, so a plain `docker compose up` leaves it out:
  #   docker compose --profile auth up
  # The API does not need it to start. It fetches the provider's keys on the
  # first request that presents a provider token, and a token from
  # `manage.py mint_token` is verified against AUTH_DEV_SIGNING_KEY without
  # any fetch at all -- which is how the tests and the e2e suite work. Start
  # this when you want the console, or to sign in against the real provider.
  auth:
    image: svhd/logto:1.43
    profiles: ["auth"]
    depends_on:
      db:
        condition: service_healthy
    # --dapc: the admin tenant's password policy otherwise consults
    # api.pwnedpasswords.com, which an offline host cannot reach, and the
    # first admin could never be created.
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe --dapc && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # The public URLs: what a browser reaches, and what the provider writes
    # into a token's issuer. The API fetches keys over the Compose network
    # instead (AUTH_INTERNAL_URL in .env.local), so the host ports are free
    # to be whatever is not taken.
    #
    # ADMIN_ENDPOINT is 127.0.0.1 rather than localhost on purpose, so open
    # the console at http://127.0.0.1:8442. The console runs on this port but
    # calls the default tenant's management API on the other one, and Logto
    # only sends the CORS headers for that cross-origin call if the browser's
    # origin matches ADMIN_ENDPOINT. Its `npm start` forces
    # NODE_ENV=production, and in production it drops any origin whose
    # hostname is the literal string `localhost` as unsafe -- which would be
    # this one. 127.0.0.1 is the same host and survives the check.
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgres://pharmacy:pharmacy@db:5432/auth
      ENDPOINT: http://localhost:${AUTH_PORT:-8441}
      ADMIN_ENDPOINT: http://127.0.0.1:${AUTH_CONSOLE_PORT:-8442}
    ports:
      - "${AUTH_PORT:-8441}:3001"
      - "${AUTH_CONSOLE_PORT:-8442}:3002"

  # One-shot: creates the identity server's first admin from
  # AUTH_ADMIN_USERNAME / AUTH_ADMIN_PASSWORD in .env.local, so a fresh stack
  # has a console login without the Welcome page. Idempotent, like migrate.
  auth-seed:
    build: .
    env_file: .env.local
    profiles: ["auth"]
    depends_on:
      auth:
        condition: service_healthy
    environment:
      ADMIN_ENDPOINT: http://127.0.0.1:${AUTH_CONSOLE_PORT:-8442}
      AUTH_INTERNAL_ADMIN_ENDPOINT: http://auth:3002
    volumes:
      - .:/app
    command: ["python", "scripts/create_auth_admin.py"]

  web:
    build: .
    env_file: .env.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Interpolated by Compose from the shell, not from .env.local:
      #   WEB_PORT=9000 docker compose up
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  pgdata:
