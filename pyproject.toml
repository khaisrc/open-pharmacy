[project]
name = "open-pharmacy"
version = "0.1.0"
description = "REST API over the pharmacy domain"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.9.1",
    "psycopg[binary]>=3.3.5",
    "django-filter>=26.1",
    "django-safedelete>=1.5.0",
    "django-environ>=0.14.0",
    "django-cors-headers>=4.9.0",
    "whitenoise>=6.12.0",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "factory-boy>=3.3.3",
    "ruff>=0.16.8",
    # Embedded PostgreSQL for running the suite on a host with no Postgres.
    # Opt-in through PHARMACY_TEST_DB=embedded in pharmacy/tests/conftest.py;
    # Compose and CI keep using the real server in DATABASE_URL.
    "pgserver>=0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["pharmacy/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["B008"]

# report.py is one long HTML template held in f-strings. Wrapping its markup at
# 100 columns to satisfy E501 would make the page harder to read than the code.
[tool.ruff.lint.per-file-ignores]
"e2e/bin/report.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
